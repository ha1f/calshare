name: usage-report

# H12: Cloudflare 使用量の定期監視。しきい値超過があれば Issue でオーナーに判断を仰ぐ
# （docs/runbooks/usage.md、design.md §14 の対応方針）。
on:
  schedule:
    # 毎週月曜 09:00 JST = 00:00 UTC。schedule は default branch (main) からしか発火しない。
    - cron: '0 0 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Node のバージョンを決める
        id: node-version
        run: echo "version=$(cat .nvmrc 2>/dev/null || echo 22)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      # H5（API トークン発行）より前に main へマージされると、schedule はこの時点で発火し始める。
      # provision / deploy は前提が無いときスキップして成功終了する設計なので、ここも合わせる
      # （失敗メールが毎週届く状態を「そういうもの」にしない）。
      - name: Secrets の登録状況を確認する
        id: secrets-check
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN または CLOUDFLARE_ACCOUNT_ID が未登録のためスキップしました。" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "docs/runbooks/cloudflare-api-token.md の手順で発行し、GitHub Secrets に登録してください（H5）。" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 使用量レポートを取得する
        id: usage
        if: steps.secrets-check.outputs.present == 'true'
        run: |
          node scripts/cf/usage-report.mjs --json > usage.json
          node scripts/cf/usage-report.mjs --markdown-from-json usage.json > usage.md
          cat usage.md >> "$GITHUB_STEP_SUMMARY"
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('usage.json','utf8')).exceeded.length)")
          echo "exceeded_count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: しきい値超過の Issue を用意する
        if: steps.secrets-check.outputs.present == 'true' && steps.usage.outputs.exceeded_count != '0'
        run: |
          gh label create "owner help wanted" --color "B60205" --description "オーナーの判断が必要な運用課題" 2>/dev/null || true
          TITLE="[運用] Cloudflare 使用量がしきい値を超えています"
          NUMBER=$(gh issue list --label "owner help wanted" --state open --json number,title --jq "map(select(.title==\"$TITLE\")) | .[0].number // empty")
          if [ -z "$NUMBER" ]; then
            gh issue create --title "$TITLE" --label "owner help wanted" --body-file usage.md
          else
            gh issue comment "$NUMBER" --body-file usage.md
          fi
