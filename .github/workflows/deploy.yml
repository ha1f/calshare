name: deploy

# 公開の承認ゲート。DEPLOY_ENABLED を true にする1回の操作が公開承認になる（docs/runbooks/deploy.md）。
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# 本番デプロイは同時に1本しか走らせない。実行中のデプロイをキャンセルすると
# D1 マイグレーションと wrangler deploy の間で状態が壊れるので cancel-in-progress は使わない。
concurrency:
  group: production
  cancel-in-progress: false

# shell を省略したときの既定（bash -e）には pipefail が無く、`node ... | tee` の node が失敗しても
# step が成功扱いになる。明示すると bash --noprofile --norc -eo pipefail で動く。
defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: DEPLOY_ENABLED を確認する
        id: check
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          if [ "$DEPLOY_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_ENABLED=true のため本番デプロイを実行します。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_ENABLED が未設定のためスキップ" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "公開する準備ができたら \`gh variable set DEPLOY_ENABLED --body true\` を実行してください（docs/runbooks/deploy.md）。" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm }

      # PUBLIC_DOMAIN が未設定のまま本番デプロイすると、wrangler.jsonc の既定値
      # （vars.PUBLIC_ORIGIN = http://localhost:8787）のまま公開され、sameOrigin の検証
      # （design.md §9.8）が本番の Origin と一致せず作成・編集・通報がすべて 403 になる。
      # DEPLOY_ENABLED=true は「公開してよい」という承認なので、ビルドや D1 マイグレーション適用に
      # 進む前にここで止めて壊れたサービスを公開させない（docs/runbooks/deploy.md の必須手順）。
      - name: PUBLIC_DOMAIN が設定されていることを確認する
        env:
          PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN }}
        run: |
          if [ -z "$PUBLIC_DOMAIN" ]; then
            echo "PUBLIC_DOMAIN が未設定です。\`gh variable set PUBLIC_DOMAIN --body <ドメイン>\` を実行してから再実行してください。" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "未設定のままデプロイすると localhost 向けの設定で公開され、作成・編集・通報が動かなくなります（docs/runbooks/deploy.md）。" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      - name: Worker 名を決める
        id: worker-name
        run: |
          name=$(node scripts/cf/worker-name.mjs)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Worker 名: $name" | tee -a "$GITHUB_STEP_SUMMARY"

      # secrets は wrangler deploy --secrets-file で新しいバージョンと同時に登録する。wrangler secret put を
      # デプロイの後に行うとその間は RATE_LIMIT_PEPPER 無しで動いて作成と通報が 500 になり、Worker がまだ無い
      # 初回にデプロイの前に行うと中身の無い Worker が先に作られる。ファイルは Static Assets として
      # アップロードされる dist/ の外に置く（RUNNER_TEMP はジョブの終わりに空になる）。
      - name: デプロイと同時に登録する secrets を決める
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPORT_WEBHOOK_URL: ${{ secrets.REPORT_WEBHOOK_URL }}
          WORKER_NAME: ${{ steps.worker-name.outputs.name }}
        run: |
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          echo "path=$secrets_file" >> "$GITHUB_OUTPUT"
          node scripts/cf/ensure-secret.mjs --name RATE_LIMIT_PEPPER \
            --worker-name "$WORKER_NAME" --secrets-file "$secrets_file" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "${REPORT_WEBHOOK_URL:-}" ]; then
            echo "REPORT_WEBHOOK_URL の GitHub Secret が未設定のためスキップしました（通報通知の設定は任意）" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            node scripts/cf/ensure-secret.mjs --name REPORT_WEBHOOK_URL --value "$REPORT_WEBHOOK_URL" --force \
              --worker-name "$WORKER_NAME" --secrets-file "$secrets_file" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: D1 マイグレーションを適用する
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply calshare --remote

      - name: デプロイする
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN }}
          SECRETS_FILE: ${{ steps.secrets.outputs.path }}
        run: |
          # 登録するものが無い（すべて登録済み）ときはファイルが作られない
          secrets_args=()
          if [ -f "$SECRETS_FILE" ]; then
            secrets_args=(--secrets-file "$SECRETS_FILE")
          fi
          npx wrangler deploy --var "PUBLIC_ORIGIN:https://$PUBLIC_DOMAIN" "${secrets_args[@]}"
