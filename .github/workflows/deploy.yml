name: deploy

# 公開の承認ゲート。DEPLOY_ENABLED を true にする1回の操作が公開承認になる（docs/runbooks/deploy.md）。
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# 本番デプロイは同時に1本しか走らせない。実行中のデプロイをキャンセルすると
# D1 マイグレーションと wrangler deploy の間で状態が壊れるので cancel-in-progress は使わない。
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: DEPLOY_ENABLED を確認する
        id: check
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          if [ "$DEPLOY_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_ENABLED=true のため本番デプロイを実行します。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_ENABLED が未設定のためスキップ" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "公開する準備ができたら \`gh variable set DEPLOY_ENABLED --body true\` を実行してください（docs/runbooks/deploy.md）。" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm }

      # PUBLIC_DOMAIN が未設定のまま本番デプロイすると、wrangler.jsonc の既定値
      # （vars.PUBLIC_ORIGIN = http://localhost:8787）のまま公開され、sameOrigin の検証
      # （design.md §9.8）が本番の Origin と一致せず作成・編集・通報がすべて 403 になる。
      # DEPLOY_ENABLED=true は「公開してよい」という承認なので、ビルドや D1 マイグレーション適用に
      # 進む前にここで止めて壊れたサービスを公開させない（docs/runbooks/deploy.md の必須手順）。
      - name: PUBLIC_DOMAIN が設定されていることを確認する
        env:
          PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN }}
        run: |
          if [ -z "$PUBLIC_DOMAIN" ]; then
            echo "PUBLIC_DOMAIN が未設定です。\`gh variable set PUBLIC_DOMAIN --body <ドメイン>\` を実行してから再実行してください。" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "未設定のままデプロイすると localhost 向けの設定で公開され、作成・編集・通報が動かなくなります（docs/runbooks/deploy.md）。" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      - name: D1 マイグレーションを適用する
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply calshare --remote

      - name: デプロイする
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN }}
        run: npx wrangler deploy --var "PUBLIC_ORIGIN:https://$PUBLIC_DOMAIN"

      # RATE_LIMIT_PEPPER が未登録のまま公開されると、ip_hash の HMAC 鍵が無い状態で動く
      # （design.md §9.3）。provision workflow の再実行をオーナー作業として残さないよう、
      # デプロイ直後に Worker が存在する状態でここで確認・登録する。
      - name: RATE_LIMIT_PEPPER を確認・登録する
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cf/ensure-secret.mjs --name RATE_LIMIT_PEPPER | tee -a "$GITHUB_STEP_SUMMARY"

      # provision の secrets ジョブは Worker が未デプロイのうちはスキップするため、初回デプロイの
      # 前に REPORT_WEBHOOK_URL の GitHub Secret だけ設定していた場合、ここで登録するまで
      # Worker 側に反映されない（docs/runbooks/provisioning.md）。
      - name: REPORT_WEBHOOK_URL を確認・登録する
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPORT_WEBHOOK_URL: ${{ secrets.REPORT_WEBHOOK_URL }}
        run: |
          if [ -z "${REPORT_WEBHOOK_URL:-}" ]; then
            echo "REPORT_WEBHOOK_URL の GitHub Secret が未設定のためスキップしました（通報通知の設定は任意）" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/cf/ensure-secret.mjs --name REPORT_WEBHOOK_URL --value "$REPORT_WEBHOOK_URL" --force | tee -a "$GITHUB_STEP_SUMMARY"
